name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get install -y build-essential
      - name: Build
        run: |
          if [ -f Makefile ]; then
            make
          else
            find . -name "*.c" -not -path "./.git/*" | xargs -I{} sh -c 'gcc -o /tmp/$(basename {} .c) {} -Wall 2>&1'
          fi
